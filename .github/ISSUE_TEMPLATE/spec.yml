name: Specification
description: Start or attach an engineering specification (CLI, scan, MCP, contract)
title: "[Spec]: "
labels:
  - spec
  - needs-spec

body:
  - type: markdown
    attributes:
      value: |
        Use this when the change is already an engineering spec, not a vague product idea. Process: [specs/README.md](https://github.com/kadraman/codefence/blob/main/specs/README.md). Constitution: [specs/constitution.md](https://github.com/kadraman/codefence/blob/main/specs/constitution.md).

  - type: input
    id: slug
    attributes:
      label: Feature slug
      description: kebab-case folder name (without NNN- prefix)
      placeholder: secret-engine
    validations:
      required: true

  - type: input
    id: related_issue
    attributes:
      label: Related feature or bug issue
      description: GitHub issue URL, if any
      placeholder: https://github.com/kadraman/codefence/issues/N

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - cli
        - config
        - scan
        - findings
        - output
        - secure-coding
        - secrets
        - deps
        - hooks
        - install
        - mcp
        - nfr
        - testing
        - docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem and requirements
      description: What and why. User stories and MUST requirements. No implementation detail.
    validations:
      required: true

  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
    validations:
      required: true

  - type: textarea
    id: constitution
    attributes:
      label: Constitution risks
      description: Aspects, Finding/NDJSON, config, rule IDs, NFR, parity. Optional if none.
